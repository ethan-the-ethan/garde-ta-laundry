[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
json = "0.12.4"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-macros = "2.6.0"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
